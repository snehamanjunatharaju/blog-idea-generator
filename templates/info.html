<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page_title }} for Blog Idea Generator.">
    <title>{{ page_title }} · Blog Idea Generator</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <main class="container info-page">
        <header class="site-header">
            <div>
                <p class="eyebrow"><a href="/">Blog Idea Generator</a></p>
                <h1>{{ page_title }}</h1>
            </div>
        </header>
        <section class="info-content">
            {% for paragraph in paragraphs %}
            <p>{{ paragraph }}</p>
            {% endfor %}
            <p><a href="/">Return to the generator</a></p>
        </section>
    </main>
</body>
</html>
